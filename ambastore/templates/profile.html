{% extends "base.html" %}
{% block title %}Profil Saya — ambaSTORE{% endblock %}
{% block page %}profile{% endblock %}
{% block content %}
<main class="container">
  <h1 class="page-title">Profil Saya</h1>
  <div class="profile-grid">
    <form class="box" id="profileForm"><h3>Data Diri</h3>
      <div class="field"><label>Nama</label><input name="name" required></div>
      <div class="field"><label>Email</label><input name="email" disabled></div>
      <div class="field"><label>No. telepon</label><input name="phone" type="tel"></div>
      <div class="field"><label>Alamat utama</label><textarea name="address"></textarea></div>
      <button class="btn dark">Simpan Perubahan</button>
    </form>
    <form class="box" id="pwForm"><h3>Ganti Password</h3>
      <div class="field"><label>Password lama</label><input name="old" type="password" required></div>
      <div class="field"><label>Password baru</label><input name="new" type="password" minlength="6" required></div>
      <div class="field"><label>Ulangi password baru</label><input name="confirm" type="password" required></div>
      <div class="form-err" id="pwErr"></div>
      <button class="btn dark">Ubah Password</button>
    </form>
  </div>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/profile.js') }}"></script>{% endblock %}
